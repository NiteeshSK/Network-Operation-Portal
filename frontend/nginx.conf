server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /login {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        try_files /login.html =404;
    }

    location = /login.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        try_files /login.html =404;
    }

    location = /_noc_auth {
        internal;
        proxy_pass http://backend:8000/api/noc/portal/nginx-auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @noc_login_redirect {
        return 302 $scheme://$http_host/login?return=$request_uri;
    }

    # Server-Sent Events for live server metrics. MUST come before the
    # generic /api/ block. SSE needs buffering OFF and no read timeout,
    # otherwise nginx holds the stream and the graph never updates.
    location ~ ^/api/servers/[^/]+/stream$ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie            $http_cookie;
        proxy_set_header Connection        "";

        proxy_buffering       off;
        proxy_cache           off;
        chunked_transfer_encoding on;
        proxy_read_timeout    24h;
        proxy_send_timeout    24h;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie            $http_cookie;

        proxy_connect_timeout 130s;
        proxy_send_timeout    130s;
        proxy_read_timeout    300s;   # agent tool-loops can take a while
    }

    location /docs {
        auth_request /_noc_auth;
        error_page 401 = @noc_login_redirect;
        proxy_pass http://backend:8000/docs;
    }

    location /redoc {
        auth_request /_noc_auth;
        error_page 401 = @noc_login_redirect;
        proxy_pass http://backend:8000/redoc;
    }

    location /openapi.json {
        auth_request /_noc_auth;
        error_page 401 = @noc_login_redirect;
        proxy_pass http://backend:8000/openapi.json;
    }

    # NOC_PORTAL_NO_CACHE_APP_V1
    location ~ \.jsx$ {
        add_header Content-Type "text/babel";
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        try_files $uri =404;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        auth_request /_noc_auth;
        error_page 401 = @noc_login_redirect;
        try_files $uri $uri/ /index.html;
    }
}
